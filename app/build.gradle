plugins {
    id 'com.android.application'
    id 'jacoco'
}

android {
    namespace 'com.github.meatcar.splitvoice'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.github.meatcar.splitvoice'
        minSdk 31
        targetSdk 35
        versionCode((findProperty('versionCode') ?: '1') as int)
        versionName findProperty('versionName') ?: '0.1.0'
    }
    buildFeatures { aidl true }
    buildTypes { debug { enableUnitTestCoverage true } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // NOTE: Robolectric loads framework classes without a code location.
            jacoco { includeNoLocationClasses = true; excludes = ['jdk.internal.*'] }
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/licenses')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def licenseAssets = tasks.register('licenseAssets', Sync) {
    from(rootProject.projectDir) {
        include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES'
    }
    into layout.buildDirectory.dir('generated/licenses')
}
tasks.named('preBuild') { dependsOn licenseAssets }

def coverageClasses = fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) {
    // NOTE: RouteService runs in Shizuku's shell process against hidden APIs; only a phone can exercise it.
    exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class', '**/IRouteService*.class', '**/RouteService*.class'
}
tasks.register('verifyCoverage', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    executionData.from(layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'))
    classDirectories.from(coverageClasses)
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.75 } } }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
}
