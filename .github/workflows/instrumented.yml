name: Instrumented

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - app/src/androidTest/**
      - app/src/main/java/com/github/meatcar/splitvoice/AudioServiceBackend.java
      - app/src/main/java/com/github/meatcar/splitvoice/RouteService.java
      - app/src/main/java/com/github/meatcar/splitvoice/RouteTrial.java
      - .github/workflows/instrumented.yml

permissions:
  contents: read

jobs:
  emulator:
    name: Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # NOTE: every Android version the app supports; hidden audio APIs can change in any of them
        api-level: [31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'flake.lock') }}
          restore-keys: gradle-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: nix develop -c ./check connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: instrumented-reports-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
