name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # NOTE: Instrumented falls back to this cache; Maven Central rate-limits parallel jobs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'flake.lock') }}
          restore-keys: gradle-
      - name: Check scripts
        run: nix develop -c shellcheck check .agents/setup .agents/resume .agents/sandbox/*.sh .github/sign-release
      - name: Test, lint and assemble
        run: nix develop -c ./check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: split-voice-development
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/ui/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
