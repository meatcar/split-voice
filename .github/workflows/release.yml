name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', docs/**, LICENSE, NOTICE, THIRD_PARTY_NOTICES]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Bump to start a new minor or major line. The patch is the commit count.
  VERSION_BASE: '0.1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Choose version
        shell: bash
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          {
            echo "RELEASE_CODE=$count"
            echo "RELEASE_VERSION=$VERSION_BASE.$count"
            echo "RELEASE_TAG=v$VERSION_BASE.$count"
          } >> "$GITHUB_ENV"
      - name: Skip an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "$RELEASE_TAG already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test, lint and assemble
        if: steps.existing.outputs.skip != 'true'
        run: >
          nix develop -c ./check testDebugUnitTest lintRelease assembleRelease
          "-PversionCode=$RELEASE_CODE" "-PversionName=$RELEASE_VERSION"
      - name: Validate version
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          jq -e --arg name "$RELEASE_VERSION" --argjson code "$RELEASE_CODE" \
            '.applicationId == "com.github.meatcar.splitvoice" and (.elements | length == 1)
             and .elements[0].versionName == $name and .elements[0].versionCode == $code' "$metadata"
      - name: Sign and verify APK
        if: steps.existing.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: nix develop -c .github/sign-release
      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/split-voice-$RELEASE_TAG.apk" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Split Voice $RELEASE_TAG" --generate-notes
